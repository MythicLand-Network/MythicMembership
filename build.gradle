plugins {
    id 'idea'
    id 'java-library'
}

idea.module.name = name

group = 'cn.mythicland'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/repository/public/' }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
    compileOnly 'cn.mythicland:mythic-framework-core:1.0.0'
    compileOnly 'cn.mythicland:mythic-framework-bukkit:1.0.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
    testImplementation 'cn.mythicland:mythic-framework-core:1.0.0'
    testImplementation 'cn.mythicland:mythic-framework-bukkit:1.0.0'
    testImplementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '-Xshare:off'
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion.set('')
}

tasks.named('jar') {
    archiveFileName = 'MythicMemberLib.jar'
}

tasks.named('sourcesJar') {
    archiveFileName = 'MythicMemberLib-sources.jar'
}
