plugins { id 'com.gradleup.shadow' }

def frameworkDirectory = rootProject.projectDir.parentFile.name == 'dependencies'
        ? rootProject.file('../MythicFramework')
        : rootProject.file('dependencies/MythicFramework')
apply from: new File(frameworkDirectory, 'gradle/runtime-library-manifest.gradle')

configurations {
    commonRuntimeLibraries
    sqliteRuntimeLibraries
    postgresqlRuntimeLibraries
}

dependencies {
    compileOnly 'com.zaxxer:HikariCP:4.0.3'
    compileOnly 'org.flywaydb:flyway-core:10.17.0'
    compileOnly 'org.flywaydb:flyway-database-postgresql:10.17.0'
    compileOnly 'org.postgresql:postgresql:42.7.4'
    compileOnly 'org.xerial:sqlite-jdbc:3.46.1.3'
    compileOnly 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'

    firstParty project(':mythic-membership-api')
    firstParty 'cn.mythicland:mythic-framework-core:1.0.0'
    firstParty 'cn.mythicland:mythic-framework-bukkit:1.0.0'

    commonRuntimeLibraries('com.zaxxer:HikariCP:4.0.3') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    commonRuntimeLibraries 'org.flywaydb:flyway-core:10.17.0'
    sqliteRuntimeLibraries 'org.xerial:sqlite-jdbc:3.46.1.3'
    postgresqlRuntimeLibraries 'org.flywaydb:flyway-database-postgresql:10.17.0'
    postgresqlRuntimeLibraries 'org.postgresql:postgresql:42.7.4'

    testImplementation 'com.zaxxer:HikariCP:4.0.3'
    testImplementation 'org.flywaydb:flyway-core:10.17.0'
    testImplementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    testImplementation 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql:10.17.0'
    testRuntimeOnly 'org.postgresql:postgresql:42.7.4'
}

def generatedResources = layout.buildDirectory.dir('generated/runtime-resources')
def runtimeDependencyManifest = registerRuntimeLibraryManifest(
        'generateRuntimeDependencyManifest',
        generatedResources,
        'META-INF/mythicmembership-libraries.properties',
        [
                common: configurations.commonRuntimeLibraries,
                sqlite: configurations.sqliteRuntimeLibraries,
                postgresql: configurations.postgresqlRuntimeLibraries
        ]
)

processResources {
    dependsOn runtimeDependencyManifest
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') { expand props }
}

tasks.named('shadowJar') {
    archiveFileName = 'MythicMembership.jar'
    configurations = [project.configurations.firstPartyEmbedded]
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.named('jar') { archiveFileName = 'MythicMembership-plain.jar' }
tasks.named('sourcesJar') {
    dependsOn runtimeDependencyManifest
    archiveFileName = 'MythicMembership-sources.jar'
}
tasks.named('assemble') { dependsOn tasks.named('shadowJar') }
