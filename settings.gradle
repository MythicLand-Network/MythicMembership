pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'MythicMembership'

include 'api'
include 'bukkit'

project(':api').name = 'mythic-membership-api'
project(':bukkit').name = 'mythic-membership-bukkit'

def frameworkDirectory = file('../MythicFramework')

if (!frameworkDirectory.isDirectory()) {
    throw new GradleException("Missing sibling project MythicFramework: ${frameworkDirectory}")
}

includeBuild(frameworkDirectory)
