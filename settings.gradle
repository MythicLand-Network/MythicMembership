pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'MythicMembership'

include 'api'
include 'bukkit'

project(':api').name = 'mythic-membership-api'
project(':bukkit').name = 'mythic-membership-bukkit'

def frameworkDirectory = rootDir.parentFile.name == 'dependencies'
        ? file('../MythicFramework')
        : file('dependencies/MythicFramework')

if (!frameworkDirectory.isDirectory()) {
    throw new GradleException("Missing MythicFramework submodule: ${frameworkDirectory}")
}

includeBuild(frameworkDirectory)
